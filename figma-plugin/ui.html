<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CertiChain Bridge</title>
  <style>
    body { font-family: Inter, sans-serif; margin: 0; padding: 16px; background: #0F172A; color: #F8FAFC; }
    h2 { font-size: 14px; margin-top: 0; color: #38BDF8; }
    p { font-size: 11px; color: #94A3B8; line-height: 1.4; }
    button { width: 100%; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; margin-bottom: 8px; }
    .btn-primary { background: #0284C7; color: #FFF; }
    .btn-primary:hover { background: #0369A1; }
    .btn-secondary { background: #1E293B; color: #E2E8F0; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }
    textarea { width: 100%; height: 80px; background: #1E293B; border: 1px solid #334155; border-radius: 6px; color: #FFF; font-size: 10px; font-family: monospace; padding: 6px; box-sizing: border-box; margin-bottom: 8px; }
    .status { font-size: 11px; padding: 8px; border-radius: 6px; background: #1E293B; margin-top: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <h2>CertiChain Template Bridge</h2>
  <p>Paste your SVG template exported from CertiChain Studio or export the selected frame back.</p>

  <textarea id="svgInput" placeholder="Paste <svg>...</svg> here..."></textarea>
  <button id="importBtn" class="btn-primary">Import Template into Canvas</button>
  <button id="exportBtn" class="btn-secondary">Export Selected Frame to CertiChain</button>

  <div id="status" class="status" style="display:none;"></div>

  <script>
    const importBtn = document.getElementById('importBtn');
    const exportBtn = document.getElementById('exportBtn');
    const svgInput = document.getElementById('svgInput');
    const statusDiv = document.getElementById('status');

    importBtn.onclick = () => {
      const svg = svgInput.value.trim();
      if (!svg) {
        showStatus('Please paste SVG markup in the textbox above.', '#EF4444');
        return;
      }
      parent.postMessage({ pluginMessage: { type: 'import-template-svg', svgContent: svg } }, '*');
    };

    exportBtn.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'export-selected-frame' } }, '*');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'import-success') {
        showStatus('✓ Template successfully imported into Figma!', '#10B981');
      } else if (msg.type === 'export-success') {
        showStatus(`✓ Exported PNG (${msg.pngBytes.length} bytes) with ${msg.fieldLayers.length} field layers detected!`, '#10B981');
      } else if (msg.type === 'error') {
        showStatus('Error: ' + msg.message, '#EF4444');
      }
    };

    function showStatus(text, color) {
      statusDiv.style.display = 'block';
      statusDiv.style.color = color;
      statusDiv.innerText = text;
    }
  </script>
</body>
</html>
